name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg ASSESSMENT_DATE=$(date -u +%Y-%m-%d) \
            -t nginx-app:${{ github.sha }} \
            app/

      - name: Save image
        run: docker save nginx-app:${{ github.sha }} -o /tmp/nginx-app.tar

      - uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: /tmp/nginx-app.tar

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nginx-image
          path: /tmp

      - name: Load and run container
        run: |
          docker load -i /tmp/nginx-app.tar
          docker run -d --name nginx-test -p 8080:8080 nginx-app:${{ github.sha }}
          sleep 5

      - name: Run healthcheck
        run: bash scripts/healthcheck.sh http://localhost:8080

      - name: Check /healthz
        run: bash scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Cleanup
        if: always()
        run: docker rm -f nginx-test || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: app/
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            ASSESSMENT_DATE=${{ github.run_id }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nginx-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nginx-app:latest
