server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nomad-nginx
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.hashicorp.nomad.job_id=nginx-app"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_hashicorp_nomad_alloc_id]
        target_label: nomad_alloc_id
      - source_labels: [__meta_docker_container_label_com_hashicorp_nomad_job_id]
        target_label: service
      - replacement: "nginx"
        target_label: job
    pipeline_stages:
      - docker: {}
